name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a

      - name: Print MATLAB version
        run: matlab -batch "disp(version)"

      - name: Run tests
        run: matlab -batch "addpath('src'); results = runtests('tests'); disp(table(results)); assertSuccess(results)"
